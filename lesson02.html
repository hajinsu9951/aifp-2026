  html:`<div class="hook"><div class="hk">Experience</div>

 {n:"02",h:"② 기계학습 — 데이터가 규칙을 만든다",
  html:`<figure class="fig"><img src="assets/b_mltypes_19.png" alt="그림 I-5 기계학습의 학습 유형" loading="lazy">

   <div class="box"><b>CPU와 GPU는 어떤 차이가 있나요?</b> (교과서 19쪽 Q&amp;A)<br>

    <br><br><span style="color:var(--dim)">비유하면 CPU는 박사 한 명, GPU는 초등학생 천 명입니다. 어려운 문제 하나는 박사가, 쉬운 계산 천 개는 초등학생 천 명이 빠릅니다. 딥러닝은 후자입니다.</span></div>`,

   <p>보통 <b>수십억 개의 매개 변수</b>를 학습하므로 고성능 GPU나 <b class="term">TPU</b>와 대규모 클라우드가 사실상 필수입니다.</p>
   <div class="box"><b>융합 프로젝트에서의 쓸모</b> · 아이디어를 빠르게 구체화하고 시제품을 단기간에 만들 수 있으며,
   프로그래밍 코드도 자연어 지시로 생성할 수 있어 <b>더 많은 사람이 문제 해결에 참여</b>할 수 있습니다.</div>
   <div class="box warn"><b class="t">동시에 제기되는 문제</b><b>허위 정보 생성, 저작권 침해, 편향된 결과.</b>
   그래서 이 강좌는 모든 과제에 <b>프롬프트 로그</b>(입력 · 결과 · 내가 고친 부분)를 함께 제출하도록 합니다.
   <b>AI를 쓰지 말라는 것이 아니라, 쓴 흔적을 남기고 검증하라는 것</b>입니다.</div>

  html:`<div class="tline">
   <div class="tl2"><div class="dot"></div><div class="yr">1950s ~ 1980s</div><div class="tt2">규칙 기반 (rule-based)</div>
    <div class="dd">사람이 만든 조건(if-then)에 따라 컴퓨터가 결과를 도출. <b>지금도 쓰인다</b> — 자동판매기, 신호등, 온도 제어기.</div></div>
   <div class="tl2"><div class="dot"></div><div class="yr">1990s ~ 2010s</div><div class="tt2">기계학습 (machine learning)</div>
    <div class="dd">컴퓨터가 데이터에서 규칙을 스스로 학습해 예측. <b>지금도 주력</b> — 스팸 필터, 배달 도착 예측, 신용 평가.</div></div>
   <div class="tl2"><div class="dot"></div><div class="yr">2012 ~</div><div class="tt2">딥러닝 (deep learning)</div>
    <div class="dd">인공신경망을 여러 층으로 연결해 복잡한 데이터를 학습. GPU와 클라우드가 이것을 가능하게 했다. <b>이미지 · 음성 · 언어</b>에 강하다.</div></div>
   <div class="tl2"><div class="dot"></div><div class="yr">2022 ~</div><div class="tt2">생성형 인공지능 (generative AI)</div>
    <div class="dd">학습한 정보를 바탕으로 <b>새로운 데이터를 스스로 생성</b>. 텍스트 · 이미지 · 음악 · 코드. 지금 여러분이 매일 쓰는 그것.</div></div>

  html:`<div class="hook"><div class="hk">Experience</div>

    <li>슬라이더를 <b>50 : 50</b>에 놓았을 때와 <b>90 : 10</b>에 놓았을 때, 두 유형의 정확도 차이는 각각 몇 %p인가요?</li>
    <li>90 : 10일 때 학교에 <b>전체 정확도만</b> 보고했다면, 그 보고는 거짓말인가요? 무엇을 빠뜨린 것인가요?</li>
    <li>이 문제를 고치려면 <b>무엇</b>을 바꿔야 하나요? 알고리즘인가요, 데이터인가요?</li>
   </ol></div>
   <div class="box warn"><b class="t">이것이 &lsquo;공정성&rsquo; 원칙입니다</b>교과서 24쪽의 예 — &ldquo;<b>학습 데이터의 80%가 20대 남성으로 구성되어 특정 집단에 유리한 결과가 나타날 수 있다.</b>&rdquo;
   이런 근거를 함께 제시하는 것이 해석의 신뢰성을 높입니다.</div>`},
 {n:"03",h:"데이터 활용의 네 가지 위험과 대응",
  lead:"교과서 23쪽. 이 네 가지는 우리 강좌의 <b>제출물 감점 기준</b>과 그대로 연결됩니다.",
  html:`<figure class="fig"><img src="assets/b_risk_23.png" alt="그림 I-8 데이터 활용 과정의 주요 위험과 대응 방안" loading="lazy">
   <figcaption><b>교과서 23쪽 · 그림 Ⅰ-8</b> 데이터 활용 과정의 주요 위험과 대응 방안</figcaption></figure>
   <div class="box warn"><b class="t">이 강좌의 규칙으로 옮기면</b>
   <ul>
    <li><b>개인 정보 유출</b> → 설문 · 관찰 데이터에 실명을 쓰지 않습니다. 사진은 동의 없이 제출물에 넣지 않습니다.</li>
    <li><b>데이터 편향</b> → 우리 반 남학생만 조사한 결과를 &lsquo;고등학생 전체&rsquo;로 말하지 않습니다.</li>
    <li><b>저작권 침해</b> → 이미지 · 글 · 코드의 <b>출처를 반드시 표기</b>합니다.</li>
    <li><b>보안 취약</b> → API 인증키를 코드에 그대로 두고 GitHub에 올리지 않습니다.</li>
   </ul></div>`,
  pages:[{p:23,t:"그림 Ⅰ-8 주요 위험과 대응 방안"}]},
 {n:"04",h:"② 설명 가능한 결과와 표현 — &ldquo;왜?&rdquo;에 답할 수 있는가",
  html:`<div class="box"><b>생각해 보기</b> · 대학 입시에서 AI가 여러분을 <b>불합격</b>시켰습니다.
   이유를 물었더니 &ldquo;<b>모델이 그렇게 판단했습니다</b>&rdquo;라는 답만 돌아옵니다. 납득할 수 있나요?</div>
   <p>이래서 결과를 <b>설명 가능한 방식</b>으로 제시하는 것이 중요합니다. 이미지 분류에서 &ldquo;이 부분 때문에 고양이라고 판단했다&rdquo;를 시각적으로 보여 주거나,
   텍스트 분석에서 어떤 단어가 영향을 주었는지 색으로 표시하는 기술이 개발되고 있습니다. 이것이 <b class="term">설명 가능한 인공지능(XAI)</b>입니다.</p>
   <figure class="fig"><img src="assets/b_xai_24.png" alt="표 I-3 인공지능과 설명 가능한 인공지능의 비교" loading="lazy">
    <figcaption><b>교과서 24쪽 · 표 Ⅰ-3</b> 인공지능(AI)과 설명 가능한 인공지능(XAI)의 비교</figcaption></figure>
   <div class="ask"><div class="ah">발문</div>
   표의 여섯 질문 중 <b>12회차 성과공유회에서 심사위원이 실제로 던질 질문</b>은 무엇일까요?
   미리 답을 준비해 두면 그날 편합니다.</div>`,
  pages:[{p:24,t:"② 설명 가능한 결과와 표현 · 표 Ⅰ-3"}]},
 {n:"05",h:"③ 협업을 위한 도구와 문화",
  html:`<figure class="fig"><img src="assets/b_collab_25.png" alt="협업 도구 형상 관리 이슈 트래킹 공유 문서" loading="lazy">
   <figcaption><b>교과서 25쪽</b> 형상 관리 도구 · 이슈 트래킹 도구 · 공유 문서</figcaption></figure>
   <div class="tw"><table style="min-width:600px">
    <thead><tr><th style="width:120px">도구</th><th style="width:150px">대표 도구</th><th>이 강좌에서 언제 쓰나</th></tr></thead>
    <tbody>
     <tr><td><b>형상 관리</b></td><td>Git, GitHub, GitLab</td><td><b>11회차</b> — 게임과 보고서를 GitHub에 올립니다</td></tr>
     <tr><td><b>이슈 트래킹</b></td><td>Jira, Trello, GitHub Issues</td><td><b>7~10회차</b> — 팀 할 일을 To Do / Doing / Done으로 관리합니다</td></tr>
     <tr><td><b>공유 문서</b></td><td>Google Docs, Notion</td><td><b>오늘부터</b> — 활동지를 구글 문서로 제출합니다</td></tr>
    </tbody></table></div>
   <div class="box tip"><b>교과서의 마지막 문장</b> · &ldquo;협업은 단순히 도구 사용에 그치지 않고, <b>서로의 기여를 존중하고 책임을 나누는 문화</b>가 뒷받침되어야 한다.&rdquo;</div>`,
  pages:[{p:25,t:"③ 협업을 위한 도구와 문화"}]},
 {n:"06",h:"읽을거리 — 데이터의 폭발, 인공지능의 도약",
  html:`<figure class="fig"><img src="assets/b_read_26.png" alt="읽을거리 데이터의 폭발 인공지능의 도약" loading="lazy">
   <figcaption><b>교과서 26쪽</b> 과거 — 직접 촬영하여 모으다 / 인터넷 시대 — 검색으로 모으다 / 생성형 인공지능 시대 — 생성하여 모으다</figcaption></figure>
   <div class="ask"><div class="ah">발문 · 오늘의 마지막 질문</div>
   생성형 AI가 만든 강아지 사진으로 &lsquo;강아지 분류 모델&rsquo;을 학습시키면 어떤 일이 생길까요?
   그 모델은 <b>진짜 강아지</b>를 잘 알아볼까요? 방금 조작해 본 <b>편향 시뮬레이터</b>를 떠올려 보세요.</div>`,
  pages:[{p:26,t:"읽을거리 — 데이터의 폭발, 인공지능의 도약"}]}],
 quiz:[
 {q:"책임 있는 데이터 활용의 기본 원칙에 해당하지 <b>않는</b> 것은?",

 {q:"학습 데이터의 90%가 A 유형이고 10%만 B 유형일 때 나타나는 가장 큰 문제는?",

{kind:"task",nav:"과제",mins:60,title:"내가 쓰는 서비스 해부하기",
 sub:"8차시 · 교과서 27쪽 역량 키우기 활동. 오늘 배운 모든 것을 서비스 하나에 적용합니다.",
 sections:[
 {n:"01",h:"활동 안내",
  lead:"생활 속에서 사용하는 앱이나 서비스를 하나 골라, 그 안에 숨어 있는 데이터의 <b>수집 – 전송 – 저장 – 처리 – 표현</b> 과정을 탐구합니다. 강의 ①의 <b>배달 앱 해부</b>를 여러분의 서비스로 다시 하는 것입니다.",
  html:`<figure class="fig"><img src="assets/b_steps_27.png" alt="교과서 27쪽 활동 단계 표" loading="lazy">
   <figcaption><b>교과서 27쪽</b> 활동 단계 — 여섯 단계의 탐구 질문과 기록 예시</figcaption></figure>
   <div class="box tip"><b>고르기 좋은 서비스</b> · 내비게이션 · 배달 앱 · 스마트워치 · 음악 추천 · 지도 앱 · 교통카드 · 무인 계산대 · 유튜브 추천 · 학교 급식 앱<br>
   <b>피해야 할 것</b> · 내가 한 번도 써 보지 않은 서비스, 어떤 데이터를 모으는지 짐작조차 안 되는 서비스</div>
   <div class="box"><b>탐정처럼 근거 찾는 법</b>
    <ul>
     <li>앱의 <b>개인정보처리방침</b>을 열면 &ldquo;수집하는 개인정보 항목&rdquo;이 그대로 적혀 있습니다. 2번 칸의 정답이 거기 있습니다.</li>
     <li>휴대폰 설정 → 앱 → <b>권한</b> 목록(위치 · 카메라 · 마이크 · 신체 활동)이 어떤 센서를 쓰는지 알려 줍니다.</li>
     <li>비행기 모드로 바꿔 보면 <b>어떤 기능이 죽는지</b>로 무엇이 서버에서 오는지 알 수 있습니다.</li>
     <li>생성형 AI에게 물어봐도 좋지만, <b>답을 그대로 옮기지 말고</b> 직접 확인한 근거를 함께 적으세요.</li>
    </ul></div>`,
  pages:[{p:27,t:"역량 키우기 활동 — 융합 프로젝트를 만드는 기술의 변화"}]},
 {n:"02",h:"이렇게 쓰면 상, 이렇게 쓰면 하",
  html:`<div class="grid g2">
   <div class="card" style="border-color:rgba(139,192,164,.3)"><h4 style="color:var(--green)">상 수준</h4>
    <p style="color:var(--tx)">&ldquo;GPS 위치를 계속 수집한다. <b>앱 권한 목록에 &lsquo;위치(항상 허용)&rsquo;</b>가 있고, 앱을 켜자마자 현재 위치가 바로 표시되며, 개인정보처리방침 3조에 &lsquo;위치정보 수집&rsquo;이 명시되어 있다.&rdquo;</p>
    <p style="margin-top:9px;color:var(--dim)">→ 판단 + 확인 가능한 근거 3개</p></div>
   <div class="card" style="border-color:rgba(217,138,122,.3)"><h4 style="color:var(--rose)">하 수준</h4>
    <p style="color:var(--tx)">&ldquo;위치&rdquo;</p>
    <p style="margin-top:9px;color:var(--dim)">→ 단어만 있고 근거가 없음. 교과서 예시를 그대로 베낀 것</p></div>
  </div>
  <div class="box warn"><b class="t">주의</b>교과서 27쪽 표의 회색 글씨는 <b>한 단어짜리 힌트</b>일 뿐입니다. 그대로 옮겨 적으면 &lsquo;하&rsquo;입니다.
  <b>왜 그렇게 판단했는지 근거를 한 문장씩</b> 붙여야 합니다.</div>`}],
 worksheet:{title:"융합 프로젝트를 만드는 기술의 변화",
  desc:"교과서 27쪽 활동을 옮긴 활동지입니다. 입력하는 즉시 저장되며, 다 쓰면 아래 <b>구글 문서로 만들기</b>로 제출하세요.",
  fields:[
  {label:"1. 서비스 선택 — 어떤 서비스(앱/기기)를 선택했는가?",req:1,rows:2,hint:"서비스 이름과 내가 그것을 언제 어떻게 쓰는지 함께 적습니다.",ph:"예) 카카오내비 — 주말에 가족과 외출할 때 아버지가 사용한다."},
  {label:"2. 데이터 수집 — 이 서비스는 어떤 데이터를 모으는가?",req:1,rows:3,hint:"어떤 센서 또는 입력으로 모으는지, 그렇게 판단한 근거(권한 목록 · 개인정보처리방침 등)를 함께 적습니다.",ph:"예) GPS 위치, 이동 속도, 목적지 검색 기록. 앱 권한에 '위치(항상 허용)'가 있고 개인정보처리방침에 위치정보 수집이 명시되어 있다."},
  {label:"3. 데이터 전송 및 저장 — 어떻게 전달되고 어디에 저장되는가?",req:1,rows:3,hint:"14~16쪽의 네트워크 종류와 저장 방식(DB · 데이터웨어하우스 · 클라우드 · 엣지) 중 어느 것인지 고르고 이유를 씁니다.",ph:"예) 이동 중 끊기면 안 되므로 이동 통신망(4G/5G). 전국 사용자의 실시간 위치를 모아야 하므로 클라우드 서버."},
  {label:"4. 처리 방법 — 어떤 처리 방식이 활용되는가?",req:1,rows:3,hint:"규칙 기반 / 기계학습 / 딥러닝 / 생성형 AI 중에서 고르고 <b>왜 그 방식이어야 하는지</b> 근거를 씁니다. 여러 개가 함께 쓰일 수도 있습니다.",ph:"예) 최단 경로 계산은 규칙 기반 알고리즘이지만, 도착 시간 예측은 과거 통행 데이터를 학습한 기계학습으로 보인다. 요일·시간대에 따라 예측이 달라지기 때문이다."},
  {label:"5. 데이터 윤리 — 개인정보 보호를 위해 어떤 조치를 하였는가?",req:1,rows:3,hint:"다섯 원칙과 네 가지 위험에 비추어 봅니다. <b>부족해 보이는 점</b>까지 적으면 상 수준입니다.",ph:"예) 위치 기록 삭제 메뉴가 있고 익명 통계로만 쓴다고 안내한다. 다만 앱을 쓰지 않을 때도 위치를 받는 설정이 기본값이라 '최소 수집' 원칙에는 부족해 보인다."},
  {label:"6. 협업 요소 — 시각화와 공유 요소는 무엇인가?",req:1,rows:3,hint:"결과를 어떻게 보여 주는지(지도 · 그래프 · 색상), 사용자끼리 정보를 나누는 기능이 있는지 적습니다.",ph:"예) 도로 혼잡도를 초록·노랑·빨강으로 보여 준다. 사용자가 사고·단속을 제보하면 다른 사용자에게 공유된다."},
  {label:"7. 그림으로 정리하기 — 데이터 흐름",req:1,rows:4,hint:"수집 → 전송 → 저장 → 처리 → 표현 순서로 화살표를 이어 봅니다. 종이에 그렸다면 '별도 사진 제출'이라고 적으세요.",ph:"GPS 위치 → 5G → 클라우드 DB → 기계학습 도착시간 예측 → 지도 위 색상 표시"},
  {label:"8. 정리하기 (1) 가장 핵심적인 배경 기술은 무엇인가?",req:1,rows:2,hint:"하나만 고르고 이유를 씁니다."},

 {n:"02",h:"토의 논제",
  html:`<div class="box talk"><span class="tag g">논제 1 · 모럴 머신에서 이어서</span>
   <b>같은 자율주행 알고리즘을 전 세계에 똑같이 넣어도 되는가?</b><br>
   연구 결과, 한국 · 일본 · 중국처럼 집단주의 성향이 강한 나라는 <b>연장자</b>를 더 존중했고, 개인주의 성향이 강한 나라는 <b>젊은 사람</b>을 더 살렸습니다.
   그렇다면 자동차 회사는 <b>나라마다 다른 알고리즘</b>을 넣어야 할까요? 아니면 하나로 통일해야 할까요? 우리 조의 답과 근거를 만들어 보세요.</div>
  <div class="box talk" style="margin-top:12px"><span class="tag g">논제 2 · 편향 시뮬레이터에서 이어서</span>
   <b>전체 정확도만 보고한 사람은 거짓말을 한 것인가?</b><br>
   시뮬레이터를 90 : 10에 놓으면 전체 정확도는 80%가 넘습니다. 숫자는 사실입니다. 그런데 B 유형 학생에게 그 시스템은 사실상 작동하지 않습니다.
   <b>거짓말이 아니라면 무엇이 잘못된 것</b>일까요? 앞으로 우리가 결과를 보고할 때 <b>반드시 함께 적어야 할 것</b>을 한 문장으로 정해 보세요.</div>
  <div class="box talk" style="margin-top:12px"><span class="tag g">논제 3 · 편리함의 값</span>
   <b>편리함과 개인정보, 어디까지 내줄 수 있는가?</b><br>
   내비게이션은 내 위치를, 배달 앱은 내 주소를 알아야 작동합니다. 그렇다면 <b>&lsquo;최소 수집&rsquo;의 최소</b>는 누가 정해야 할까요?

 quiz:[
 {q:"데이터 처리 방법의 발전 순서로 옳은 것은?",
  opts:["기계학습 → 규칙 기반 → 딥러닝 → 생성형 인공지능","규칙 기반 → 기계학습 → 딥러닝 → 생성형 인공지능","딥러닝 → 기계학습 → 규칙 기반 → 생성형 인공지능","규칙 기반 → 딥러닝 → 기계학습 → 생성형 인공지능"],
  a:1,why:"교과서 25쪽 · 44쪽. <b>규칙 기반 → 기계학습 → 딥러닝 → 생성형 인공지능</b>. 48쪽 대단원 평가 06번과 같은 문제입니다."},
 {q:"다음 설명에 해당하는 것은?<br><span style='color:var(--mut)'>여러 부서와 시스템에서 수집한 데이터를 한곳에 모아, 경영 의사 결정에 활용할 수 있도록 분석 중심으로 설계된 대형 저장소</span>",
  opts:["데이터베이스","데이터웨어하우스","엣지 컴퓨팅","분산 처리 시스템"],

 {q:"융합 프로젝트에서 데이터의 <b>출처를 명확히 표기하고 라이선스 조건을 확인</b>해야 하는 가장 큰 이유는?",
  opts:["데이터 용량을 줄이기 위해","저작권을 침해하지 않기 위해","전송 속도를 높이기 위해","모델 정확도를 높이기 위해"],

 {q:"오늘 수업 전체에 비추어, 프로젝트에서 기술을 선택할 때 가장 바람직한 태도는?",
  opts:["항상 가장 최신 기술을 고른다","가장 정확도가 높은 기술만 고른다","문제의 성격에 맞는 기술을 고르고 그 근거를 설명할 수 있어야 한다","다른 모둠이 쓰는 기술을 따라 고른다"],
  a:2,why:"뒤에 나온 기술이 항상 더 좋은 것은 아닙니다. 학습 목표 3번이 &lsquo;사용한 기술과 방법을 <b>선택한 근거를 설명</b>할 수 있다&rsquo;입니다. 교과서 12쪽 · 47쪽 점검하기 5번."}],}

<script>
boot();

/* ---------------- 센서 카운터 ---------------- */
(function(){
  const ITEMS=["휴대폰 알람을 껐다","지문·얼굴로 잠금을 풀었다","버스·지하철 카드를 찍었다",
   "자동문을 지났다","엘리베이터 버튼을 눌렀다","편의점에서 카드로 결제했다",
   "이어폰을 블루투스로 연결했다","걸음 수가 기록되는 앱을 쓴다","교실 조명·냉난방이 자동으로 켜졌다",
   "CCTV가 있는 곳을 지났다","지금 이 수업에 카메라를 켰다","내비게이션·지도 앱을 켰다"];
  const g=document.getElementById("scGrid");
  g.innerHTML=ITEMS.map((t,i)=>`<label><input type="checkbox" data-sc="${i}"><span>${t}</span></label>`).join("");
  const n=document.getElementById("scN"), msg=document.getElementById("scMsg");
  function upd(){
    const c=g.querySelectorAll("input:checked").length;
    n.textContent=c;
    msg.textContent = c===0 ? "해당하는 것을 모두 눌러 보세요."
      : c<=3 ? "생각보다 적나요? 아직 세지 않은 것이 많습니다."
      : c<=6 ? "오늘 하루 " + c + "번, 여러분은 데이터가 되었습니다."
      : c<=9 ? c + "번입니다. 이 데이터는 지금 어디에 있을까요? 누가 볼 수 있을까요?"
      : "무려 " + c + "번. 오늘 수업은 이 데이터들이 어디로 흘러가는지를 따라가는 시간입니다.";
  }
  g.addEventListener("change",upd); upd();
})();

/* ---------------- 네트워크 상황 퀴즈 ---------------- */
(function(){
  const Q=[
   {s:"<b>상황 1.</b> 학교 서버실에 있는 컴퓨터 20대를 연결합니다. 옮길 일이 없고 속도가 가장 중요합니다.",
    o:["유선 LAN","무선 LAN(Wi-Fi)","이동 통신망","LPWAN"],a:0,
    w:"<b>유선 LAN(이더넷)</b>입니다. 전송 속도가 빠르고 안정적이며, 설치와 이동에 제약이 있지만 서버실은 옮길 일이 없습니다."},
   {s:"<b>상황 2.</b> 배달 라이더의 오토바이 위치를 <b>달리는 중에도</b> 실시간으로 보내야 합니다.",
    o:["유선 LAN","무선 LAN(Wi-Fi)","이동 통신망(4G·5G)","LPWAN"],a:2,
    w:"<b>이동 통신망</b>입니다. 넓은 범위에서 이동하며 연결할 수 있습니다. Wi-Fi는 거리와 장애물의 제약이 있어 달리는 오토바이에는 맞지 않습니다."},
   {s:"<b>상황 3.</b> 논밭 곳곳에 토양 수분 센서 50개를 묻습니다. 전기를 계속 공급하기 어렵고, 5분에 한 번 숫자 몇 개만 보내면 됩니다.",
    o:["유선 LAN","무선 LAN(Wi-Fi)","이동 통신망(4G·5G)","LPWAN"],a:3,
    w:"<b>LPWAN</b>입니다. 저전력으로 장거리 통신이 가능해 배터리로 오래 버텨야 하는 IoT 기기에 적합합니다. 전송 속도가 느린 것은 문제되지 않습니다."},
   {s:"<b>상황 4.</b> 교실에서 학생들이 노트북과 태블릿으로 자료를 검색합니다. 자리를 옮겨 다니고 기기 수가 많습니다.",
    o:["유선 LAN","무선 LAN(Wi-Fi)","이동 통신망(4G·5G)","LPWAN"],a:1,
    w:"<b>무선 LAN(Wi-Fi)</b>입니다. 가정과 사무실, 교실처럼 한정된 공간에서 여러 기기가 이동하며 쓰기에 적합하고 요금 부담도 없습니다."}];
  document.getElementById("netq").innerHTML=Q.map((q,i)=>
   `<div class="nq" data-nq="${i}"><div class="s">${q.s}</div>
     <div class="opts2">${q.o.map((t,j)=>`<button onclick="nqPick(${i},${j})">${t}</button>`).join("")}</div>
     <div class="fb">${q.w}</div></div>`).join("");
  window.__NQ=Q;
})();
function nqPick(i,j){
  const Q=window.__NQ, root=document.querySelector(`.nq[data-nq="${i}"]`);
  if(root.dataset.done)return; root.dataset.done="1";
  root.querySelectorAll(".opts2 button").forEach((b,k)=>{
    if(k===Q[i].a)b.classList.add("ok"); else if(k===j)b.classList.add("no");
  });
  root.querySelector(".fb").classList.add("on");
}

/* ---------------- 편향 시뮬레이터 ---------------- */
(function(){
  const r=document.getElementById("bRange");
  /* 표본이 적을수록 정확도가 크게 떨어지도록 — 데이터가 적으면 못 배운다 */
  function acc(nSamples){ return 50 + 47*(1-Math.exp(-nSamples/25)); }
  function upd(){
    const a=+r.value, b=100-a;
    document.getElementById("bA").textContent=a;
    document.getElementById("bB").textContent=b;
    const accA=acc(a), accB=acc(b), tot=(accA+accB)/2;
    const set=(fl,vv,v)=>{document.getElementById(fl).style.width=v+"%";document.getElementById(vv).textContent=v.toFixed(0)+"%";};
    set("flA","vA",accA); set("flB","vB",accB); set("flT","vT",tot);
    const gap=Math.abs(accA-accB);
    const weak = accA<accB ? "A" : "B";
    const m=document.getElementById("bMsg");
    if(gap<6) m.innerHTML=`두 유형의 정확도 차이가 <b>${gap.toFixed(0)}%p</b>입니다. 데이터를 고르게 모았을 때 나오는 결과입니다. 전체 정확도는 <b>${tot.toFixed(0)}%</b>.`;
    else if(gap<25) m.innerHTML=`전체 정확도는 <b>${tot.toFixed(0)}%</b>로 나쁘지 않아 보입니다. 그런데 <b>${weak} 유형</b> 학생은 <b>${Math.min(accA,accB).toFixed(0)}%</b>밖에 되지 않습니다. 차이 <b>${gap.toFixed(0)}%p</b>.`;
    else m.innerHTML=`전체 정확도 <b>${tot.toFixed(0)}%</b>. 하지만 <b>${weak} 유형</b> 학생에게는 <b>${Math.min(accA,accB).toFixed(0)}%</b> — 사실상 <b>쓸 수 없는 시스템</b>입니다. 그 학생들은 매일 아침 문 앞에서 멈춰 서게 됩니다. 이것이 <b>데이터 편향</b>입니다.`;
  }
  r.addEventListener("input",upd); upd();
})();
</script>
