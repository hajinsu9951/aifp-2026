<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>12회차 · 성과공유회</title>
<link rel="stylesheet" href="style.css?v=12">
<style>
/* 12회차 전용 — 발표 순서 · 동료 평가표 */
.order{display:grid;gap:8px;margin:16px 0}
.ord{display:grid;grid-template-columns:64px 1fr 100px;gap:12px;align-items:center;border:1px solid var(--line);
 border-radius:4px;padding:12px 15px;background:rgba(255,255,255,.014);transition:.16s}
.ord.now{border-color:var(--accent);background:rgba(216,180,90,.09)}
.ord.past{opacity:.5}
.ord .no2{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--accent);line-height:1}
.ord input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:3px;color:var(--tx);
 padding:8px 11px;font-size:13px;font-family:var(--sans)}
.ord input:focus{outline:0;border-color:var(--accent)}
.ord .tm4{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right}
.pe{border:1px solid var(--line);border-radius:4px;background:var(--ink2);padding:20px;margin:16px 0}
.pe .team{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pe .team input{flex:1 1 200px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:3px;
 color:var(--tx);padding:9px 11px;font-size:13px;font-family:var(--sans)}
.pe table{min-width:520px}
.pe .yn{display:flex;gap:6px;justify-content:center}
.pe .yn button{font-size:11.5px;font-weight:700;border:1px solid var(--line2);background:transparent;color:var(--mut);
 border-radius:2px;padding:5px 11px;cursor:pointer;font-family:var(--sans)}
.pe .yn button.y.on{background:var(--green);color:var(--ink);border-color:transparent}
.pe .yn button.n.on{background:var(--rose);color:var(--ink);border-color:transparent}
.pe textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:3px;color:var(--tx);
 padding:10px 12px;font-size:13px;font-family:var(--sans);line-height:1.7;resize:vertical;margin-top:6px}
.pe .saved2{display:grid;gap:7px;margin-top:14px}
.pe .card2{border:1px solid var(--line);border-radius:3px;padding:11px 14px;font-size:12.5px;color:var(--mut);
 background:rgba(255,255,255,.015);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pe .card2 b{color:var(--tx)}
.pe .card2 .sc2{font-family:var(--serif);font-weight:800;color:var(--accent);font-size:15px;white-space:nowrap}

/* ── 학생 사례 갤러리 ── */
.gal{margin:16px 0}
.galbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--ink2);cursor:pointer;
 transition:.18s;display:flex;flex-direction:column;text-align:left}
.gcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.gcard .thumb{aspect-ratio:4/3;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative}
.gcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .thumb .ph{font-size:34px;opacity:.35}
.gcard .kind{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;
 background:rgba(12,13,18,.82);color:var(--accent);border:1px solid var(--line2);border-radius:2px;padding:3px 7px}
.gcard .body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:5px}
.gcard .ttl{font-family:var(--serif);font-size:15.5px;font-weight:800;color:var(--tx);line-height:1.35}
.gcard .who{font-size:11.5px;color:var(--dim)}
.gcard .one{font-size:12.5px;color:var(--mut);line-height:1.6;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.galempty{border:1px dashed var(--line2);border-radius:5px;padding:34px 20px;text-align:center;color:var(--dim);font-size:13px}

/* 사례 등록 폼 */
.gform{border:1px solid var(--line);border-radius:5px;background:var(--ink2);padding:20px;margin-top:16px;display:none}
.gform.on{display:block}
.gform .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.gform label{display:block;font-size:12px;font-weight:700;color:var(--tx);margin-bottom:5px}
.gform input[type=text],.gform select,.gform textarea{width:100%;background:rgba(255,255,255,.04);
 border:1px solid var(--line);border-radius:3px;color:var(--tx);padding:9px 11px;font-size:13px;
 font-family:var(--sans);line-height:1.7;resize:vertical}
.gform input:focus,.gform select:focus,.gform textarea:focus{outline:0;border-color:var(--accent)}
.gform select option{background:var(--ink2);color:var(--tx)}
.gform .drop{border:1px dashed var(--line2);border-radius:4px;padding:16px;text-align:center;font-size:12.5px;
 color:var(--dim);cursor:pointer;transition:.16s}
.gform .drop:hover{border-color:var(--accent);color:var(--mut)}
.gform .drop img{max-height:130px;border-radius:3px;display:block;margin:0 auto 8px}

/* 사례 뷰어 */
#gv{position:fixed;inset:0;background:rgba(6,7,10,.94);z-index:120;display:none;
 align-items:center;justify-content:center;padding:24px}
#gv.on{display:flex}
#gv .sheet{background:var(--ink2);border:1px solid var(--line2);border-radius:6px;max-width:860px;width:100%;
 max-height:92vh;overflow:auto;padding:0}
#gv .shot{width:100%;max-height:46vh;object-fit:contain;background:rgba(255,255,255,.03);display:block}
#gv .in2{padding:24px 28px 28px}
#gv h3{font-family:var(--serif);font-size:24px;font-weight:800;color:var(--tx);margin:0 0 6px;line-height:1.3}
#gv .meta2{font-size:12px;color:var(--dim);margin-bottom:16px}
#gv .sect{margin-top:16px}
#gv .sect b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--accent);margin-bottom:5px}
#gv .sect p{font-size:13.5px;color:var(--mut);line-height:1.8;margin:0;white-space:pre-wrap}
#gv .lnk{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#gv .lnk a{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--line2);border-radius:3px;
 padding:7px 13px;text-decoration:none}
#gv .lnk a:hover{border-color:var(--accent)}
#gv .foot2{display:flex;justify-content:space-between;align-items:center;gap:12px;
 border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
#gv .cnt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
#gv .x2{position:fixed;top:18px;right:22px;background:transparent;border:0;color:var(--mut);font-size:26px;cursor:pointer}
</style></head><body>

<div class="lhead" id="lhead"></div>
<div class="bnav" id="bnav"></div>
<div id="blocks"></div>
<div id="timer"></div>

<div id="gv" onclick="if(event.target.id==='gv')gvClose()">
  <button class="x2" onclick="gvClose()">✕</button>
  <div class="sheet" id="gvSheet"></div>
</div>

n:12,date:"2026.11.17",dow:"화",time:"18:00~22:00",ch:"45~48차시",mode:"대면 수업 · 융합과학실",

  html:`<div class="order" id="ordList"></div>

 {n:"02",h:"듣는 사람에게",
  html:`<div class="box"><b>발표를 들으며 할 일</b>

 {n:"03",h:"학생 사례 — 오늘 발표한 프로젝트",

 quiz:[

<script>
boot();

/* ---------------- 발표 순서 ---------------- */
const ORD_START=18*60+20;   /* 18:20 */
const ORD_SLOT=8;           /* 5분 발표 + 3분 질의 */
const ORD_BREAK_AFTER=5;    /* 5팀 발표 뒤 휴식 10분 */
function ordMin(i){ return ORD_START + i*ORD_SLOT + (i>=ORD_BREAK_AFTER?10:0); }
function fmin(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
/* 시작~끝은 그 팀의 슬롯(8분)으로만 계산한다. 휴식은 다음 팀의 시작에만 반영한다. */
function ordTime(i){ const s=ordMin(i); return fmin(s)+" ~<br>"+fmin(s+ORD_SLOT); }
function ordSave(i,v){
  const d=STORE.get("order",{}); d[i]=v; STORE.set("order",d);
}
(function(){
  const N=8;
  const d=STORE.get("order",{});
  let html="";
  for(let i=0;i<N;i++){
    html+=`<div class="ord"><div class="no2">${i+1}</div>
     <input type="text" value="${(d[i]||"").replace(/"/g,"&quot;")}" placeholder="팀 이름 또는 발표자"
      oninput="ordSave(${i},this.value)">
     <div class="tm4">${ordTime(i)}</div></div>`;
    if(i===ORD_BREAK_AFTER-1)
      html+=`<div class="ord" style="grid-template-columns:64px 1fr 100px;opacity:.6">
        <div class="no2" style="font-size:14px">휴식</div>
        <div style="font-size:12.5px;color:var(--dim)">다음 팀은 이 시간에 연결과 실행을 미리 확인하세요</div>
        <div class="tm4">${fmin(ordMin(ORD_BREAK_AFTER)-10)} ~<br>${fmin(ordMin(ORD_BREAK_AFTER))}</div></div>`;
  }
  document.getElementById("ordList").innerHTML=html;
})();

/* ---------------- 동료 평가표 ---------------- */
const PE_CRIT=[
 {k:"기능 구현",q:"게임 또는 시스템의 필수 기능이 정상적으로 동작하는가?"},
 {k:"창의성",q:"독창적인 아이디어와 기능이 포함되었는가?"},
 {k:"완성도",q:"화면 구성과 조작감 등 결과물의 완성도가 높은가?"},
 {k:"프롬프트 활용",q:"생성형 인공지능을 적절히 활용하여 문제를 해결했는가?"},
 {k:"발표력",q:"제작 과정을 명확하게 설명하고 시연했는가?"}
];
let peCur={};
function peSet(i,v){
  peCur[i]=v;
  document.querySelectorAll(`.yn[data-i="${i}"] button`).forEach(b=>{
    b.classList.toggle("on", b.dataset.v===v);
  });
}
function peSave(){
  const team=document.getElementById("peTeam").value.trim();
  const learn=document.getElementById("peLearn").value.trim();
  if(!team){toast("팀 이름을 입력해 주세요");return;}
  if(!learn){toast("배우고 싶은 점을 반드시 적어 주세요");return;}
  const all=STORE.get("peers",[]);
  all.push({team,ev:{...peCur},learn,ask:document.getElementById("peAsk").value.trim()});
  STORE.set("peers",all);
  peClear(); pePaint();
  toast(team+" 평가를 저장했습니다");
}
function peClear(){
  document.getElementById("peTeam").value="";
  document.getElementById("peLearn").value="";
  document.getElementById("peAsk").value="";
  peCur={};
  document.querySelectorAll(".yn button").forEach(b=>b.classList.remove("on"));
}
function peDel(i){
  const all=STORE.get("peers",[]); all.splice(i,1); STORE.set("peers",all); pePaint();
}
function pePaint(){
  const all=STORE.get("peers",[]);
  document.getElementById("peSaved").innerHTML = all.length
    ? all.map((p,i)=>{
        const y=Object.values(p.ev).filter(v=>v==="y").length;
        return `<div class="card2"><div><b>${esc(p.team)}</b> — ${esc(p.learn).slice(0,60)}${p.learn.length>60?"…":""}</div>
          <div style="display:flex;gap:10px;align-items:center"><span class="sc2">예 ${y}/5</span>
          <button class="tbtn ghost" style="padding:4px 9px;font-size:11px" onclick="peDel(${i})">삭제</button></div></div>`;
      }).join("")
    : `<div style="font-size:12.5px;color:var(--dim)">아직 저장된 평가가 없습니다. 발표를 들으며 기록해 주세요.</div>`;
  document.getElementById("peMsg").textContent = all.length? all.length+"개 팀 평가 완료" : "";
}
function peCopy(){
  const all=STORE.get("peers",[]);
  if(!all.length){toast("저장된 평가가 없습니다");return;}
  let t=`[2026.11.17 성과공유회] 동료 평가 기록\n${"─".repeat(40)}\n\n`;
  all.forEach(p=>{
    t+=`■ ${p.team}\n`;
    PE_CRIT.forEach((c,i)=>{t+=`  ${c.k} — ${p.ev[i]==="y"?"예":p.ev[i]==="n"?"아니요":"미기록"}\n`;});
    t+=`  배우고 싶은 점 — ${p.learn}\n`;
    if(p.ask)t+=`  궁금한 점 — ${p.ask}\n`;
    t+="\n";
  });
  copyText(t,null);
}
/* ---------------- 학생 사례 갤러리 ---------------- */
/* 사례는 이 브라우저(localStorage)에 저장한다. 사진은 긴 변 900px JPEG로 줄여
   용량 초과를 피하고, 교사는 내보내기/불러오기로 다른 컴퓨터에 옮긴다. */
let CASES=[], gPicData="";

function gLoad(){ CASES=STORE.get("cases",[]); gPaint(); }
function gStore(){
  try{ STORE.set("cases",CASES); return true; }
  catch(e){ toast("저장 공간이 가득 찼습니다. 사진 없이 등록하거나 내보내기 후 정리해 주세요."); return false; }
}
function gFormToggle(open){
  const f=document.getElementById("gForm");
  const on = open===0 ? false : !f.classList.contains("on");
  f.classList.toggle("on",on);
  if(on) document.getElementById("gTtl").focus();
}
function gPick(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      gPicData=cv.toDataURL("image/jpeg",0.75);
      document.getElementById("gPrev").innerHTML=`<img src="${gPicData}" alt="">`;
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function gSave(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v("gTtl")||!v("gWho")||!v("gOne")){ toast("제목 · 학생/팀 · 한 줄 소개는 반드시 적어 주세요"); return; }
  CASES.push({ttl:v("gTtl"),kind:v("gKind"),sch:v("gSch"),who:v("gWho"),one:v("gOne"),
              pic:gPicData,git:v("gGit"),vid:v("gVid"),how:v("gHow"),lim:v("gLim")});
  if(!gStore()){ CASES.pop(); return; }
  ["gTtl","gSch","gWho","gOne","gGit","gVid","gHow","gLim"].forEach(id=>document.getElementById(id).value="");
  gPicData=""; document.getElementById("gPrev").innerHTML="";
  gFormToggle(0); gPaint();
  toast("사례를 등록했습니다");
}
function gDel(i,ev){
  ev.stopPropagation();
  if(!confirm(`「${CASES[i].ttl}」 사례를 지울까요?`))return;
  CASES.splice(i,1); gStore(); gPaint(); gvClose();
}
function gPaint(){
  const w=document.getElementById("gWrap");
  if(!CASES.length){
    w.innerHTML=`<div class="galempty">아직 등록된 사례가 없습니다.<br>
      발표가 끝난 팀부터 <b>[+ 사례 추가]</b>로 넣어 주세요.</div>`;
  }else{
    w.innerHTML=`<div class="galgrid">`+CASES.map((c,i)=>`
      <div class="gcard" onclick="gvOpen(${i})">
        <div class="thumb">${c.pic?`<img src="${c.pic}" alt="">`:`<span class="ph">🖥</span>`}
          <span class="kind">${esc(c.kind||"프로젝트")}</span></div>
        <div class="body">
          <div class="ttl">${esc(c.ttl)}</div>
          <div class="who">${esc([c.sch,c.who].filter(Boolean).join(" · "))}</div>
          <div class="one">${esc(c.one)}</div>
        </div></div>`).join("")+`</div>`;
  }
  document.getElementById("gMsg").textContent = CASES.length? `사례 ${CASES.length}건` : "";
}

/* ── 사례 뷰어 (이전/다음 넘김) ── */
let GVI=-1;
function gvOpen(i){ GVI=i; gvPaint(); document.getElementById("gv").classList.add("on"); }
function gvClose(){ document.getElementById("gv").classList.remove("on"); GVI=-1; }
function gvStep(d){ if(!CASES.length)return; GVI=(GVI+d+CASES.length)%CASES.length; gvPaint(); }
function gvPaint(){
  const c=CASES[GVI]; if(!c)return;
  const sect=(t,v)=>v?`<div class="sect"><b>${t}</b><p>${esc(v)}</p></div>`:"";
  const lnk=(t,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`:"";
  document.getElementById("gvSheet").innerHTML=
    (c.pic?`<img class="shot" src="${c.pic}" alt="">`:"")+
    `<div class="in2">
      <h3>${esc(c.ttl)}</h3>
      <div class="meta2">${esc(c.kind||"")}${c.kind?" · ":""}${esc([c.sch,c.who].filter(Boolean).join(" · "))}</div>
      <div class="sect"><b>한 줄 소개</b><p>${esc(c.one)}</p></div>
      ${sect("어떻게 만들었나",c.how)}
      ${sect("배운 점과 한계",c.lim)}
      <div class="lnk">${lnk("GitHub",c.git)}${lnk("시연 영상",c.vid)}</div>
      <div class="foot2">
        <button class="tbtn ghost" onclick="gDel(${GVI},event)">이 사례 삭제</button>
        <span class="cnt">${GVI+1} / ${CASES.length}</span>
        <span style="display:flex;gap:8px">
          <button class="tbtn ghost" onclick="gvStep(-1)">‹ 이전</button>
          <button class="tbtn ghost" onclick="gvStep(1)">다음 ›</button>
        </span>
      </div>
    </div>`;
}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("gv").classList.contains("on"))return;
  if(e.key==="Escape")gvClose();
  else if(e.key==="ArrowLeft")gvStep(-1);
  else if(e.key==="ArrowRight")gvStep(1);
});

/* ── 내보내기 · 불러오기 ── */
function gExport(){
  if(!CASES.length){toast("등록된 사례가 없습니다");return;}
  const blob=new Blob([JSON.stringify(CASES,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="cases.json";
  document.body.appendChild(a); a.click(); a.remove();
  toast(`사례 ${CASES.length}건을 cases.json으로 저장했습니다`);
}
function gImport(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const arr=JSON.parse(fr.result);
      if(!Array.isArray(arr))throw 0;
      /* 제목+학생이 같은 사례는 중복으로 보고 건너뛴다 */
      const key=c=>c.ttl+"|"+c.who, have=new Set(CASES.map(key));
      const add=arr.filter(c=>c&&c.ttl&&!have.has(key(c)));
      CASES=CASES.concat(add); gStore(); gPaint();
      toast(add.length?`사례 ${add.length}건을 불러왔습니다`:"새로 추가할 사례가 없습니다");
    }catch(e){ toast("사례 파일을 읽지 못했습니다 (cases.json 형식이 아닙니다)"); }
    inp.value="";
  };
  fr.readAsText(f);
}
/* 페이지 옆에 cases.json 이 있으면 처음 열 때 자동으로 채운다 */
gLoad();
if(!CASES.length){
  fetch("cases.json").then(r=>r.ok?r.json():null).then(a=>{
    if(Array.isArray(a)&&a.length){ CASES=a.filter(c=>c&&c.ttl); gStore(); gPaint(); }
  }).catch(()=>{});
}

  document.getElementById("peRows").innerHTML=PE_CRIT.map((c,i)=>

      <button class="n" data-v="n" onclick="peSet(${i},'n')">아니요</button>
     </div></td></tr>`).join("");
  pePaint();
})();
